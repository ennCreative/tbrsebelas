# Deploy Dashboard TBR Region XI ke GitHub Pages (situs HTML statis, tanpa build)
name: Deploy Dashboard TBR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Siapkan file situs
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/

      - name: Upload situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
